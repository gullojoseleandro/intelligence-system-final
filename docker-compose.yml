services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 30

  model-pull:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull gemma3:1b && ollama pull embeddinggemma:300m-qat-q4_0"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ingest:
    build: .
    command: ["python", "-m", "app.rag.ingest"]
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_EMBED_MODEL: embeddinggemma:300m-qat-q4_0
      RAG_DB_PATH: /service/vectorstore
    volumes:
      - vectorstore-data:/service/vectorstore
    depends_on:
      model-pull:
        condition: service_completed_successfully
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:latest
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ENABLE_AUTH: "false"
    volumes:
      - phoenix-data:/mnt/data
    ports:
      - "127.0.0.1:6006:6006"

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in the environment or .env before starting}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL_MODE: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: gemma3:1b
      OLLAMA_EMBED_MODEL: embeddinggemma:300m-qat-q4_0
      RAG_DB_PATH: /service/vectorstore
      PHOENIX_TRACING: "true"
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - vectorstore-data:/service/vectorstore
    depends_on:
      redis:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      phoenix:
        condition: service_started

volumes:
  redis-data:
  ollama-data:
  vectorstore-data:
  phoenix-data:
